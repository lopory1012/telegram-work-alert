name: Telegram Work Alert

on:
  schedule:
  - cron: '50 14 * * *'
  - cron: '50 12 * * 0,1,4,5'
  - cron: '15 2 * * *'      # ← 임시 테스트용, 확인 후 삭제할 것
workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Send Telegram alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
