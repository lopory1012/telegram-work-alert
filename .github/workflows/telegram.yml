name: Telegram Work Alert

on:
schedule:
  - cron: '50 14 * * *'        # 매일 23:50 KST (일일보고)
  - cron: '50 12 * * 0,1,4,5'  # 21:50 KST, 일/월/목/금 (사전취합 관련)
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Send Telegram alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
